<h2>歡迎安裝 LeakBolt</h2>
<p>LeakBolt 會在每次用 Git 保存變更前檢查密鑰、權杖和其他不該公開的資料。發現問題時，它會中止保存並告訴你是哪個檔案需要處理。</p>
<p>安裝完成後，目前帳號的所有 Git 專案都會立即受保護，之後新建的專案也一樣。不需要另外下載其他工具。</p>
<p>若日後要移除，請打開「終端機」，貼上並執行：</p>
<p><code>sudo /usr/local/leakbolt/uninstall.sh</code></p>
